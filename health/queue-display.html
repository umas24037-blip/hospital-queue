<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartQueue — Live Queue</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue-light:#eff6ff;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;
  --gray-400:#94a3b8;--gray-600:#475569;--gray-800:#1e293b;
  --radius:12px;--shadow:0 4px 24px rgba(0,0,0,.08);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gray-50);min-height:100vh;padding-top:4.5rem}

nav{
  position:fixed;top:0;left:0;right:0;background:#fff;
  border-bottom:1px solid var(--gray-200);padding:.9rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06);
}
.nav-brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.1rem;color:var(--blue)}
.nav-brand span{font-size:1.4rem}
.nav-links{display:flex;gap:.5rem}
.nav-links a{
  padding:.45rem .9rem;border-radius:8px;font-size:.82rem;
  font-weight:600;text-decoration:none;color:var(--gray-600);transition:all .2s;
}
.nav-links a:hover{background:var(--blue-light);color:var(--blue)}
.nav-links a.active{background:var(--blue);color:#fff}

.container{max-width:900px;margin:0 auto;padding:2rem 1rem}

/* Header row */
.top-row{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;
}
.page-title{font-size:1.5rem;font-weight:800;color:var(--gray-800)}
.page-sub{color:var(--gray-400);font-size:.82rem;margin-top:.2rem}
#clock{font-size:1rem;font-weight:700;color:var(--blue);background:var(--blue-light);padding:.4rem .9rem;border-radius:20px}

/* Doctor tabs */
.doctor-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{
  padding:.55rem 1.1rem;border-radius:20px;font-size:.83rem;
  font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);
  background:#fff;color:var(--gray-600);transition:all .2s;
}
.tab:hover{border-color:var(--blue);color:var(--blue)}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1.5rem}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:1rem 1.2rem;
  box-shadow:var(--shadow);text-align:center;
}
.stat-num{font-size:1.8rem;font-weight:900;color:var(--blue);line-height:1}
.stat-label{font-size:.72rem;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:.25rem}

/* Queue cards */
.queue-list{display:grid;gap:.75rem}
.q-card{
  background:#fff;border-radius:16px;padding:1.1rem 1.3rem;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:1rem;
  border-left:4px solid var(--gray-200);transition:transform .2s;
}
.q-card:hover{transform:translateY(-2px)}
.q-card.p5{border-left-color:#dc2626}
.q-card.p4{border-left-color:#ea580c}
.q-card.p3{border-left-color:#ca8a04}
.q-card.p2{border-left-color:#16a34a}
.q-card.p1{border-left-color:#2563eb}
.q-card.pos1{background:linear-gradient(135deg,#eff6ff,#fff)}

.pos-num{
  font-size:1.6rem;font-weight:900;color:var(--blue);
  min-width:2.5rem;text-align:center;flex-shrink:0;
}
.q-card.pos1 .pos-num{color:#dc2626}

.q-info{flex:1;min-width:0}
.q-name{font-weight:700;font-size:.97rem;color:var(--gray-800)}
.q-symptoms{
  font-size:.78rem;color:var(--gray-400);margin-top:.2rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.q-right{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem;flex-shrink:0}
.badge{
  display:inline-block;padding:.22rem .7rem;
  border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;
}
.u5{background:#fef2f2;color:#991b1b}
.u4{background:#fff7ed;color:#9a3412}
.u3{background:#fefce8;color:#854d0e}
.u2{background:#f0fdf4;color:#166534}
.u1{background:#eff6ff;color:#1e40af}
.eta-text{font-size:.78rem;color:var(--gray-400)}
.time-text{font-size:.72rem;color:var(--gray-400)}

/* Empty / loader */
.empty-state{
  text-align:center;padding:4rem 2rem;
  background:#fff;border-radius:16px;box-shadow:var(--shadow);
}
.empty-state .icon{font-size:3rem;margin-bottom:.75rem}
.empty-state p{color:var(--gray-400);font-size:.9rem}

#loader{text-align:center;color:var(--gray-400);padding:2rem 0}
.spinner{
  display:inline-block;width:20px;height:20px;
  border:2.5px solid var(--gray-200);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:.4rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

.refresh-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:1rem;font-size:.75rem;color:var(--gray-400);
}
.refresh-btn{
  background:none;border:1px solid var(--gray-200);border-radius:8px;
  padding:.3rem .7rem;font-size:.75rem;color:var(--gray-600);
  cursor:pointer;transition:all .2s;
}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>

<nav>
  <div class="nav-brand"><span>🏥</span> SmartQueue</div>
  <div class="nav-links">
    <a href="index.html">Book</a>
    <a href="search.html">My Bookings</a>
    <a href="queue-display.html" class="active">Live Queue</a>
  </div>
</nav>

<div class="container">
  <div class="top-row">
    <div>
      <div class="page-title">📺 Live Queue</div>
      <div class="page-sub">Auto-refreshes every 15 seconds</div>
    </div>
    <div id="clock"></div>
  </div>

  <div class="doctor-tabs">
    <div class="tab active" onclick="switchDoc(1,this)">👩‍⚕️ Dr. Ayesha Khan</div>
    <div class="tab"       onclick="switchDoc(2,this)">👨‍⚕️ Dr. Bilal Ahmed</div>
    <div class="tab"       onclick="switchDoc(3,this)">👩‍⚕️ Dr. Sara Malik</div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="statTotal">—</div><div class="stat-label">Waiting</div></div>
    <div class="stat-card"><div class="stat-num" id="statNext">—</div><div class="stat-label">Next Patient</div></div>
    <div class="stat-card"><div class="stat-num" id="statMax">—</div><div class="stat-label">Max Wait</div></div>
  </div>

  <div id="loader"><span class="spinner"></span> Loading queue…</div>
  <div class="queue-list" id="queueList"></div>

  <div class="refresh-bar">
    <span id="lastUpdate"></span>
    <button class="refresh-btn" onclick="loadQueue()">↻ Refresh Now</button>
  </div>
</div>

<script>
const URGENCY = {5:['🚨 Emergency','u5'],4:['⚠️ Urgent','u4'],3:['🟡 Semi-Urgent','u3'],2:['🟢 Non-Urgent','u2'],1:['🔵 Routine','u1']};
let currentDoc = 1;

setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}, 1000);
document.getElementById('clock').textContent = new Date().toLocaleTimeString();

function switchDoc(id, el) {
  currentDoc = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadQueue();
}

async function loadQueue() {
  document.getElementById('loader').style.display = 'block';
  try {
    const res  = await fetch(`api/queue.php?doctor_id=${currentDoc}`);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { document.getElementById('lastUpdate').textContent = 'Parse error — retrying…'; return; }
    renderQueue(data.queue || [], data.total || 0);
    document.getElementById('lastUpdate').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  } catch {
    document.getElementById('lastUpdate').textContent = 'Connection error — retrying…';
  } finally {
    document.getElementById('loader').style.display = 'none';
  }
}

function renderQueue(queue, total) {
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statNext').textContent  = queue[0]?.patient_name?.split(' ')[0] || '—';
  const maxWait = queue.length ? (queue.length - 1) * 10 : 0;
  document.getElementById('statMax').textContent   = total ? `~${queue[queue.length-1]?.eta_minutes ?? maxWait}m` : '0m';

  const list = document.getElementById('queueList');
  if (!queue.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>No patients waiting right now.</p></div>`;
    return;
  }
  list.innerHTML = queue.map((row, i) => {
    const p = row.priority_score;
    const [ulabel, ucls] = URGENCY[p] || ['Unknown','u1'];
    const eta  = row.eta_minutes > 0 ? `⏱ ~${row.eta_minutes} min` : '⚡ Now';
    const time = new Date(row.booked_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return `
    <div class="q-card p${p}${i===0?' pos1':''}">
      <div class="pos-num">#${row.position}</div>
      <div class="q-info">
        <div class="q-name">${esc(row.patient_name)}</div>
        <div class="q-symptoms">${esc(row.raw_symptoms)}</div>
      </div>
      <div class="q-right">
        <span class="badge ${ucls}">${ulabel}</span>
        <span class="eta-text">${eta}</span>
        <span class="time-text">🕐 ${time}</span>
      </div>
    </div>`;
  }).join('');
}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

loadQueue();
setInterval(loadQueue, 15000);
</script>
</body>
</html>
